<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لومرا | Lumera</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a12;
  --bg2: #12121f;
  --card: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  --text: #e8e8f0;
  --text-dim: #8a8aa0;
  --accent: #7c5cff;
  --accent2: #ff5c9d;
  --accent3: #5cffb8;
  --danger: #ff5c5c;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg: #f4f4fa;
  --bg2: #ffffff;
  --card: rgba(0,0,0,0.03);
  --card-hover: rgba(0,0,0,0.06);
  --border: rgba(0,0,0,0.08);
  --text: #1a1a2e;
  --text-dim: #6a6a80;
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background .3s, color .3s;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(124,92,255,0.15), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(255,92,157,0.12), transparent 40%);
  background-attachment: fixed;
}
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent); }

/* ===== Header ===== */
header {
  position: sticky; top:0; z-index:100;
  backdrop-filter: blur(20px);
  background: rgba(10,10,18,0.7);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
[data-theme="light"] header { background: rgba(255,255,255,0.75); }
.logo {
  font-size: 24px; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex; align-items: center; gap: 8px;
}
.logo span { font-size: 28px; -webkit-text-fill-color: initial; }
.header-actions { display:flex; gap:10px; align-items:center; }
.icon-btn {
  width:42px; height:42px; border-radius:12px;
  border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all .2s;
}
.icon-btn:hover { background:var(--card-hover); transform: translateY(-2px); border-color: var(--accent); }

/* ===== Layout ===== */
.container { max-width: 1300px; margin: 0 auto; padding: 24px; }
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: var(--card); border:1px solid var(--border);
  border-radius: 18px; padding: 20px;
  backdrop-filter: blur(10px);
  transition: all .3s;
  position: relative; overflow: hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; right:0; width:80px; height:80px;
  background: radial-gradient(circle, var(--accent), transparent 70%);
  opacity:.15; border-radius:50%;
}
.stat-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
.stat-card .num { font-size: 32px; font-weight: 900; background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.stat-card .label { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
.stat-card .ico { position:absolute; left:20px; top:20px; font-size:24px; opacity:.6; }

.grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--card); border:1px solid var(--border);
  border-radius: 20px; padding: 20px;
  backdrop-filter: blur(10px);
}
.panel-title {
  font-size: 18px; font-weight: 700; margin-bottom: 16px;
  display:flex; align-items:center; gap:8px; justify-content:space-between;
}
.panel-title .t { display:flex; align-items:center; gap:8px; }

/* ===== Search ===== */
.search-box {
  width:100%; padding: 12px 16px; border-radius: 14px;
  border:1px solid var(--border); background: var(--bg2);
  color: var(--text); font-family:inherit; font-size: 14px;
  outline:none; transition: all .2s; margin-bottom: 12px;
}
.search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,0.15); }

/* ===== Lists ===== */
.list { display:flex; flex-direction:column; gap:8px; max-height: 480px; overflow-y:auto; padding-left:4px; }
.list-item {
  display:flex; align-items:center; gap:12px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--bg2); border:1px solid transparent;
  cursor:pointer; transition: all .2s;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateX(20px);} to {opacity:1; transform:none;} }
.list-item:hover { background: var(--card-hover); border-color: var(--border); transform: translateX(-4px); }
.list-item.active { border-color: var(--accent); background: rgba(124,92,255,0.1); }
.avatar {
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:16px; color:#fff;
}
.list-item .info { flex:1; min-width:0; }
.list-item .name { font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px; }
.list-item .sub { font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge {
  font-size:10px; padding:2px 8px; border-radius:8px;
  background: var(--accent); color:#fff; font-weight:700;
}
.badge.green { background: var(--accent3); color:#0a0a12; }
.item-actions { display:flex; gap:4px; opacity:0; transition: opacity .2s; }
.list-item:hover .item-actions { opacity:1; }
.mini-btn {
  width:30px; height:30px; border-radius:8px; border:none;
  background: var(--card-hover); color: var(--text-dim);
  cursor:pointer; font-size:13px; transition: all .2s;
  display:flex; align-items:center; justify-content:center;
}
.mini-btn:hover { background: var(--accent); color:#fff; }
.mini-btn.del:hover { background: var(--danger); }

/* ===== Buttons ===== */
.btn {
  padding: 11px 18px; border-radius: 12px; border:none;
  font-family:inherit; font-size:14px; font-weight:600;
  cursor:pointer; transition: all .2s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color:#fff; box-shadow: 0 4px 16px rgba(124,92,255,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(124,92,255,0.5); }
.btn-ghost { background: var(--card); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { background: var(--card-hover); }
.btn-block { width:100%; }

/* ===== Chat ===== */
.chat-panel { display:flex; flex-direction:column; height: 600px; }
.chat-header {
  padding-bottom: 14px; border-bottom:1px solid var(--border); margin-bottom: 14px;
  display:flex; align-items:center; gap:12px;
}
.chat-header .info { flex:1; }
.chat-header .name { font-weight:700; font-size:16px; }
.chat-header .status { font-size:12px; color: var(--accent3); display:flex; align-items:center; gap:4px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--accent3); box-shadow:0 0 8px var(--accent3); }
.messages { flex:1; overflow-y:auto; padding: 8px 4px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size:14px; line-height:1.6; animation: pop .25s ease; word-wrap:break-word; }
@keyframes pop { from { opacity:0; transform: scale(.9);} to {opacity:1; transform:none;} }
.msg.me { align-self: flex-start; background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; border-bottom-right-radius:4px; }
.msg.other { align-self: flex-end; background: var(--bg2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg .time { font-size:10px; opacity:.7; margin-top:4px; display:block; }
.chat-input { display:flex; gap:8px; margin-top: 14px; padding-top:14px; border-top:1px solid var(--border); }
.chat-input input {
  flex:1; padding: 12px 16px; border-radius:14px;
  border:1px solid var(--border); background: var(--bg2);
  color: var(--text); font-family:inherit; font-size:14px; outline:none;
}
.chat-input input:focus { border-color: var(--accent); }

/* ===== Empty ===== */
.empty { text-align:center; padding: 40px 20px; color: var(--text-dim); }
.empty .big { font-size: 48px; margin-bottom: 10px; opacity:.5; }

/* ===== Toast ===== */
.toast-wrap { position: fixed; bottom: 24px; left: 24px; z-index: 9999; display:flex; flex-direction:column; gap:10px; }
.toast {
  background: var(--bg2); border:1px solid var(--border);
  border-right: 4px solid var(--accent);
  padding: 14px 18px; border-radius: 12px; box-shadow: var(--shadow);
  font-size:14px; font-weight:500; min-width:240px;
  animation: toastIn .3s ease; backdrop-filter: blur(10px);
}
@keyframes toastIn { from { opacity:0; transform: translateX(-40px);} to {opacity:1; transform:none;} }
.toast.success { border-right-color: var(--accent3); }
.toast.danger { border-right-color: var(--danger); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset:0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); z-index: 1000;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show { display:flex; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity:0;} to {opacity:1;} }
.modal {
  background: var(--bg2); border:1px solid var(--border);
  border-radius: 20px; padding: 24px; width:100%; max-width: 440px;
  box-shadow: var(--shadow); animation: modalIn .3s ease;
}
@keyframes modalIn { from { opacity:0; transform: scale(.9) translateY(20px);} to {opacity:1; transform:none;} }
.modal h3 { margin-bottom: 18px; font-size:18px; }
.field { margin-bottom: 14px; }
.field label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; }
.field input, .field select {
  width:100%; padding: 11px 14px; border-radius:12px;
  border:1px solid var(--border); background: var(--bg);
  color:var(--text); font-family:inherit; font-size:14px; outline:none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.modal-actions { display:flex; gap:10px; margin-top: 20px; }
.modal-actions .btn { flex:1; }

/* ===== Floating Add ===== */
.fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 500;
  width: 60px; height: 60px; border-radius: 50%; border:none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color:#fff; font-size: 28px; cursor:pointer;
  box-shadow: 0 8px 24px rgba(124,92,255,0.5);
  transition: all .3s; display:flex; align-items:center; justify-content:center;
}
.fab:hover { transform: scale(1.1) rotate(90deg); }

/* ===== Tabs ===== */
.tabs { display:flex; gap:6px; margin-bottom: 14px; background: var(--bg2); padding:5px; border-radius:14px; }
.tab {
  flex:1; padding: 9px; border-radius:10px; border:none;
  background:transparent; color: var(--text-dim); font-family:inherit;
  font-size:13px; font-weight:600; cursor:pointer; transition: all .2s;
}
.tab.active { background: var(--accent); color:#fff; }

/* ===== Mobile ===== */
@media (max-width: 600px) {
  .container { padding: 16px; }
  header { padding: 12px 16px; }
  .logo { font-size: 20px; }
  .stat-card .num { font-size: 26px; }
  .chat-panel { height: 500px; }
  .toast-wrap { left: 12px; right: 12px; bottom: 12px; }
  .fab { bottom: 80px; }
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>✨</span> لومرا</div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="تغییر تم" id="themeBtn">🌙</button>
    <button class="icon-btn" onclick="openModal('settingsModal')" title="تنظیمات">⚙️</button>
  </div>
</header>

<div class="container">
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="ico">📢</div>
      <div class="num" id="statChannels">0</div>
      <div class="label">کانال‌ها</div>
    </div>
    <div class="stat-card">
      <div class="ico">👥</div>
      <div class="num" id="statUsers">0</div>
      <div class="label">کاربران</div>
    </div>
    <div class="stat-card">
      <div class="ico">💬</div>
      <div class="num" id="statMsgs">0</div>
      <div class="label">پیام‌ها</div>
    </div>
    <div class="stat-card">
      <div class="ico">⚡</div>
      <div class="num" id="statAdmins">0</div>
      <div class="label">ادمین‌ها</div>
    </div>
  </div>

  <div class="grid">
    <!-- Channels Panel -->
    <div class="panel">
      <div class="panel-title">
        <div class="t">📢 کانال‌ها</div>
        <button class="mini-btn" onclick="openModal('channelModal')" title="کانال جدید">➕</button>
      </div>
      <input class="search-box" id="searchChannel" placeholder="🔍 جستجوی کانال..." oninput="renderChannels()">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('channels', this)">📢 کانال‌ها</button>
        <button class="tab" onclick="switchTab('users', this)">👥 کاربران</button>
      </div>
      <div class="list" id="channelList"></div>
    </div>

    <!-- Chat Panel -->
    <div class="panel chat-panel">
      <div class="chat-header">
        <div class="avatar" id="chatAvatar" style="background:linear-gradient(135deg,#7c5cff,#ff5c9d)">💬</div>
        <div class="info">
          <div class="name" id="chatName">یک کانال انتخاب کنید</div>
          <div class="status" id="chatStatus"><span class="dot"></span> آنلاین</div>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="empty">
          <div class="big">💬</div>
          <div>برای شروع چت، یک کانال از لیست انتخاب کنید</div>
        </div>
      </div>
      <div class="chat-input">
        <input id="msgInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn btn-primary" onclick="sendMsg()">ارسال ➤</button>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal('channelModal')" title="کانال جدید">+</button>

<!-- Channel Modal -->
<div class="modal-overlay" id="channelModal">
  <div class="modal">
    <h3>📢 ساخت کانال جدید</h3>
    <div class="field">
      <label>نام کانال</label>
      <input id="newChannelName" placeholder="مثلاً: تیم لومرا">
    </div>
    <div class="field">
      <label>توضیحات</label>
      <input id="newChannelDesc" placeholder="توضیح کوتاه...">
    </div>
    <div class="field">
      <label>رنگ کانال</label>
      <select id="newChannelColor">
        <option value="linear-gradient(135deg,#7c5cff,#ff5c9d)">بنفش-صورتی</option>
        <option value="linear-gradient(135deg,#5cffb8,#7c5cff)">سبز-بنفش</option>
        <option value="linear-gradient(135deg,#ff5c9d,#ffb85c)">صورتی-نارنجی</option>
        <option value="linear-gradient(135deg,#5cc8ff,#7c5cff)">آبی-بنفش</option>
        <option value="linear-gradient(135deg,#ff5c5c,#ff5c9d)">قرمز-صورتی</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('channelModal')">لغو</button>
      <button class="btn btn-primary" onclick="createChannel()">ساخت کانال</button>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h3>👤 افزودن کاربر</h3>
    <div class="field">
      <label>نام کاربر</label>
      <input id="newUserName" placeholder="مثلاً: علی رضایی">
    </div>
    <div class="field">
      <label>نقش</label>
      <select id="newUserRole">
        <option value="member">عضو</option>
        <option value="admin">ادمین</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('userModal')">لغو</button>
      <button class="btn btn-primary" onclick="createUser()">افزودن</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ تنظیمات</h3>
    <div class="field">
      <label>نام نمایشی شما</label>
      <input id="myName" placeholder="نام شما...">
    </div>
    <div class="field">
      <label>تم</label>
      <select id="themeSelect" onchange="setTheme(this.value)">
        <option value="dark">🌙 تاریک</option>
        <option value="light">☀️ روشن</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('settingsModal')">بستن</button>
      <button class="btn btn-primary" onclick="saveSettings()">ذخیره</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============ State ============ */
let state = {
  channels: [],
  users: [],
  messages: {},
  activeChannel: null,
  myName: 'من',
  theme: 'dark'
};

/* ============ Init ============ */
function init() {
  const saved = localStorage.getItem('lumera_state');
  if (saved) {
    try { state = {...state, ...JSON.parse(saved)}; } catch(e){}
  }
  if (!state.channels.length) {
    state.channels = [
      { id: 1, name: 'کانال عمومی', desc: 'خوش آمدید به لومرا', color: 'linear-gradient(135deg,#7c5cff,#ff5c9d)', members: 12 },
      { id: 2, name: 'تیم توسعه', desc: 'بحث‌های فنی', color: 'linear-gradient(135deg,#5cffb8,#7c5cff)', members: 5 },
      { id: 3, name: 'اخبار', desc: 'آخرین خبرها', color: 'linear-gradient(135deg,#5cc8ff,#7c5cff)', members: 30 }
    ];
  }
  if (!state.users.length) {
    state.users = [
      { id: 1, name: 'علی رضایی', role: 'admin' },
      { id: 2, name: 'سارا محمدی', role: 'member' },
      { id: 3, name: 'رضا کریمی', role: 'member' }
    ];
  }
  state.channels.forEach(c => { if(!state.messages[c.id]) state.messages[c.id] = []; });
  document.getElementById('myName').value = state.myName;
  document.getElementById('themeSelect').value = state.theme;
  setTheme(state.theme);
  renderChannels();
  renderStats();
  updateActiveChat();
}

/* ============ Save ============ */
function save() {
  localStorage.setItem('lumera_state', JSON.stringify(state));
}

/* ============ Theme ============ */
function setTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  document.getElementById('themeSelect').value = t;
  save();
}
function toggleTheme() { setTheme(state.theme === 'dark' ? 'light' : 'dark'); }

/* ============ Tabs ============ */
let currentTab = 'channels';
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderChannels();
}

/* ============ Render ============ */
function renderChannels() {
  const list = document.getElementById('channelList');
  const q = (document.getElementById('searchChannel').value || '').toLowerCase();
  if (currentTab === 'channels') {
    const filtered = state.channels.filter(c => c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
    if (!filtered.length) { list.innerHTML = '<div class="empty"><div class="big">📭</div><div>کانالی یافت نشد</div></div>'; return; }
    list.innerHTML = filtered.map(c => `
      <div class="list-item ${state.activeChannel===c.id?'active':''}" onclick="selectChannel(${c.id})">
        <div class="avatar" style="background:${c.color}">${c.name.charAt(0)}</div>
        <div class="info">
          <div class="name">${esc(c.name)}</div>
          <div class="sub">${esc(c.desc)} • ${c.members} عضو</div>
        </div>
        <div class="item-actions">
          <button class="mini-btn" onclick="event.stopPropagation();deleteChannel(${c.id})" title="حذف">🗑️</button>
        </div>
      </div>
    `).join('');
  } else {
    const filtered = state.users.filter(u => u.name.toLowerCase().includes(q));
    list.innerHTML = filtered.map(u => `
      <div class="list-item">
        <div class="avatar" style="background:linear-gradient(135deg,#7c5cff,#ff5c9d)">${u.name.charAt(0)}</div>
        <div class="info">
          <div class="name">${esc(u.name)} ${u.role==='admin'?'<span class="badge">ادمین</span>':''}</div>
          <div class="sub">${u.role==='admin'?'مدیر':'عضو عادی'}</div>
        </div>
        <div class="item-actions">
          <button class="mini-btn" onclick="event.stopPropagation();deleteUser(${u.id})" title="حذف">🗑️</button>
        </div>
      </div>
    `).join('') || '<div class="empty"><div class="big">👥</div><div>کاربری یافت نشد</div></div>';
  }
}

function renderStats() {
  document.getElementById('statChannels').textContent = state.channels.length;
  document.getElementById('statUsers').textContent = state.users.length;
  document.getElementById('statAdmins').textContent = state.users.filter(u=>u.role==='admin').length;
  let total = 0;
  Object.values(state.messages).forEach(m => total += m.length);
  document.getElementById('statMsgs').textContent = total;
}

/* ============ Channels ============ */
function createChannel() {
  const name = document.getElementById('newChannelName').value.trim();
  const desc = document.getElementById('newChannelDesc').value.trim() || 'بدون توضیحات';
  const color = document.getElementById('newChannelColor').value;
  if (!name) return toast('نام کانال را وارد کنید', 'danger');
  const id = Date.now();
  state.channels.push({ id, name, desc, color, members: 1 });
  state.messages[id] = [];
  save(); renderChannels(); renderStats();
  closeModal('channelModal');
  document.getElementById('newChannelName').value = '';
  document.getElementById('newChannelDesc').value = '';
  toast('کانال با موفقیت ساخته شد ✨', 'success');
}

function deleteChannel(id) {
  if (!confirm('این کانال حذف شود؟')) return;
  state.channels = state.channels.filter(c => c.id !== id);
  delete state.messages[id];
  if (state.activeChannel === id) state.activeChannel = null;
  save(); renderChannels(); renderStats(); updateActiveChat();
  toast('کانال حذف شد', 'danger');
}

function selectChannel(id) {
  state.activeChannel = id;
  renderChannels();
  updateActiveChat();
}

/* ============ Users ============ */
function createUser() {
  const name = document.getElementById('newUserName').value.trim();
  const role = document.getElementById('newUserRole').value;
  if (!name) return toast('نام کاربر را وارد کنید', 'danger');
  state.users.push({ id: Date.now(), name, role });
  save(); renderChannels(); renderStats();
  closeModal('userModal');
  document.getElementById('newUserName').value = '';
  toast('کاربر افزوده شد 👤', 'success');
}

function deleteUser(id) {
  if (!confirm('این کاربر حذف شود؟')) return;
  state.users = state.users.filter(u => u.id !== id);
  save(); renderChannels(); renderStats();
  toast('کاربر حذف شد', 'danger');
}

/* ============ Chat ============ */
function updateActiveChat() {
  const ch = state.channels.find(c => c.id === state.activeChannel);
  if (!ch) {
    document.getElementById('chatName').textContent = 'یک کانال انتخاب کنید';
    document.getElementById('chatStatus').innerHTML = '<span class="dot"></span> آنلاین';
    document.getElementById('chatAvatar').textContent = '💬';
    document.getElementById('chatAvatar').style.background = 'linear-gradient(135deg,#7c5cff,#ff5c9d)';
    document.getElementById('messages').innerHTML = '<div class="empty"><div class="big">💬</div><div>برای شروع چت، یک کانال از لیست انتخاب کنید</div></div>';
    return;
  }
  document.getElementById('chatName').textContent = ch.name;
  document.getElementById('chatStatus').innerHTML = `<span class="dot"></span> ${ch.members} عضو آنلاین`;
  const av = document.getElementById('chatAvatar');
  av.textContent = ch.name.charAt(0);
  av.style.background = ch.color;
  renderMessages();
}

function renderMessages() {
  const box = document.getElementById('messages');
  const msgs = state.messages[state.activeChannel] || [];
  if (!msgs.length) {
    box.innerHTML = '<div class="empty"><div class="big">✉️</div><div>هنوز پیامی نیست. اولین پیام را بفرست!</div></div>';
    return;
  }
  box.innerHTML = msgs.map(m => `
    <div class="msg ${m.me?'me':'other'}">
      ${!m.me?`<div style="font-size:11px;font-weight:700;margin-bottom:2px;opacity:.8">${esc(m.author)}</div>`:''}
      ${esc(m.text)}
      <span class="time">${m.time}</span>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}
